services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env
    ports:
      - "8001:8001"
    environment:
      - DJANGO_DEBUG=False
      - FRONTEND_URLS=http://localhost:3000,http://localhost:3001
      - SESSION_COOKIE_SECURE=False
      # SMTP — set these for email sending
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USE_TLS=True
      - DEFAULT_FROM_EMAIL=noreply@terionix.com
    volumes:
      - backend-db:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://backend:8001
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - API_URL=http://backend:8001/api
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://backend:8001
        SCRAPER_API_TARGET: http://scraper-api:8002
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - API_URL=http://backend:8001/api
    depends_on:
      - backend
      - scraper-api
    restart: unless-stopped

  scraper-api:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - scraper-db:/app/data
    restart: unless-stopped

volumes:
  backend-db:
  scraper-db:
